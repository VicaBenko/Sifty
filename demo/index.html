<title>Sift — הדגמה</title>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f5f3;
    --panel: #ffffff;
    --ink: #1c1c1c;
    --muted: #6b6b6b;
    --line: #e2dfda;
    --accent: #2f6f4f;
    --accent-ink: #ffffff;
    --certain: #2f6f4f;
    --certain-bg: #e7f3ec;
    --borderline: #a3660b;
    --borderline-bg: #fbeed9;
    --danger: #9d2f2f;
    --danger-bg: #fbeaea;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Arial, sans-serif;
  }
  body {
    direction: rtl;
    padding: 24px 32px 120px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 20px; }

  .query-row { display: flex; gap: 10px; align-items: stretch; }
  #query {
    flex: 1;
    direction: ltr;
    text-align: left;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }
  #run {
    padding: 10px 22px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  #run:hover { opacity: 0.92; }
  #run:disabled { opacity: 0.5; cursor: default; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; min-height: 20px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 8px 6px 14px;
    font-size: 13px;
  }
  .chip button {
    border: none;
    background: var(--line);
    color: var(--ink);
    border-radius: 50%;
    width: 18px; height: 18px; line-height: 16px;
    cursor: pointer; font-size: 12px; padding: 0;
  }
  .chip button:hover { background: #cfcbc3; }

  .source-note { color: var(--muted); font-size: 12px; margin-top: -8px; margin-bottom: 12px; }

  /* P2-6 — persistent banner */
  #banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--borderline-bg);
    border: 1px solid #eccf9a;
    border-radius: 10px;
    padding: 12px 16px;
    margin: 0 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  #banner.on { display: flex; }
  #banner:hover { border-color: var(--borderline); }
  #banner strong { color: var(--borderline); }
  #banner .go {
    background: var(--borderline);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }

  .header-row {
    font-size: 14px;
    color: var(--muted);
    margin: 18px 0 12px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
  }
  .link-button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card img { display: block; width: 100%; height: 160px; object-fit: cover; }
  .badge {
    position: absolute;
    top: 8px; left: 8px;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .badge.certain { background: var(--certain-bg); color: var(--certain); }
  .badge.borderline { background: var(--borderline-bg); color: var(--borderline); }

  /* P2-1 — selection checkbox */
  .pick {
    position: absolute;
    top: 6px; right: 6px;
    background: rgba(255,255,255,0.94);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px;
    line-height: 0;
  }
  .pick input { width: 18px; height: 18px; margin: 0; cursor: pointer; accent-color: var(--accent); }

  .reason {
    direction: ltr;
    text-align: left;
    font-size: 12px;
    padding: 8px 10px;
    color: var(--ink);
    border-top: 1px solid var(--line);
  }

  .empty-state { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }

  /* P2-2 — action bar */
  #actionBar {
    display: none;
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 12px 32px;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
  }
  #actionBar.on { display: flex; }
  #selectionSummary { font-size: 14px; }
  #selectionSummary .muted { color: var(--muted); font-size: 13px; }
  #copyButton {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
  }
  #copyButton:disabled { opacity: 0.5; cursor: default; }

  /* P2-7 — approval screen */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(28,28,28,0.45);
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  #overlay.on { display: flex; }
  .sheet {
    background: var(--panel);
    border-radius: 14px;
    max-width: 560px;
    width: 100%;
    padding: 26px 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.22);
  }
  .sheet h2 { margin: 0 0 6px; font-size: 18px; }
  .sheet p { font-size: 14px; line-height: 1.6; margin: 10px 0; }
  .sheet .count { font-size: 30px; font-weight: 700; color: var(--danger); }
  .sheet .path {
    direction: ltr;
    text-align: left;
    font-family: Consolas, monospace;
    font-size: 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    word-break: break-all;
  }
  .sheet .note {
    background: var(--danger-bg);
    border: 1px solid #e9c3c3;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.6;
  }
  .sheet .actions { display: flex; gap: 10px; margin-top: 20px; }
  .sheet button {
    border: none;
    border-radius: 8px;
    padding: 11px 20px;
    font-size: 14px;
    cursor: pointer;
  }
  #confirmDelete { background: var(--danger); color: #fff; }
  #cancelApprove { background: var(--line); color: var(--ink); }
  #closeSheet { background: var(--accent); color: var(--accent-ink); }
</style>

<h1>Sift — הדגמה</h1>
<p class="subtitle">כתבו תיאור באנגלית, ערכו את הפרדיקטים במידת הצורך, ולחצו הפעל.</p>

<div class="query-row">
  <input id="query" type="text" placeholder="a dog" autocomplete="off">
  <button id="run">הפעל</button>
</div>

<div id="chips" class="chips"></div>
<div id="sourceNote" class="source-note"></div>

<div id="banner">
  <span id="bannerText"></span>
  <button class="go" id="bannerButton">פתיחת מסך האישור</button>
</div>

<div id="headerRow" class="header-row"></div>
<div id="grid" class="grid"></div>

<div id="actionBar">
  <div id="selectionSummary"></div>
  <button id="copyButton">העתקה להסגר</button>
</div>

<div id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
  const state = {
    predicates: [],
    lastExtractedQuery: null,
    lastRunQuery: "",
    matches: [],
    selected: new Set(),
    quarantine: null,
  };

  const queryInput = document.getElementById("query");
  const runButton = document.getElementById("run");
  const chipsEl = document.getElementById("chips");
  const sourceNoteEl = document.getElementById("sourceNote");
  const headerRowEl = document.getElementById("headerRow");
  const gridEl = document.getElementById("grid");
  const bannerEl = document.getElementById("banner");
  const bannerTextEl = document.getElementById("bannerText");
  const bannerButton = document.getElementById("bannerButton");
  const actionBarEl = document.getElementById("actionBar");
  const selectionSummaryEl = document.getElementById("selectionSummary");
  const copyButton = document.getElementById("copyButton");
  const overlayEl = document.getElementById("overlay");
  const sheetEl = document.getElementById("sheet");

  function formatSize(bytes) {
    if (!bytes) return "0 ק\"ב";
    if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} ק"ב`;
    return `${(bytes / (1024 * 1024)).toFixed(1)} מ"ב`;
  }

  async function postJSON(url, body) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `${url} failed (${res.status})`);
    return data;
  }

  // --- P2-6: the banner, rebuilt from disk state on every load ------------
  async function refreshQuarantine() {
    const res = await fetch("/api/quarantine");
    state.quarantine = await res.json();
    const awaiting = state.quarantine.awaiting;
    bannerEl.classList.toggle("on", awaiting > 0);
    if (awaiting > 0) {
      bannerTextEl.innerHTML =
        `<strong>${awaiting} תמונות ממתינות לאישור</strong> · ` +
        `${formatSize(state.quarantine.bytes)} בתיקיית ההסגר. שום דבר לא נמחק עדיין.`;
    }
  }

  function renderChips() {
    chipsEl.innerHTML = "";
    state.predicates.forEach((pred, index) => {
      const chip = document.createElement("span");
      chip.className = "chip";
      const label = document.createElement("span");
      label.textContent = pred.label;
      chip.appendChild(label);

      const remove = document.createElement("button");
      remove.textContent = "×";
      remove.title = "הסר";
      remove.addEventListener("click", () => {
        state.predicates.splice(index, 1);
        renderChips();
      });
      chip.appendChild(remove);
      chipsEl.appendChild(chip);
    });
  }

  // --- P2-2: live selected count and size ---------------------------------
  function renderSelection() {
    const chosen = state.matches.filter((m) => state.selected.has(m.id));
    const bytes = chosen.reduce((sum, m) => sum + (m.bytes || 0), 0);
    actionBarEl.classList.toggle("on", state.matches.length > 0);
    copyButton.disabled = chosen.length === 0;
    copyButton.textContent = chosen.length
      ? `העתקת ${chosen.length} להסגר`
      : "העתקה להסגר";
    selectionSummaryEl.innerHTML = chosen.length
      ? `נבחרו <strong>${chosen.length}</strong> מתוך ${state.matches.length} · ${formatSize(bytes)}` +
        `<div class="muted">העתקה בלבד — המקור נשאר בתיקיית התמונות עד לאישור.</div>`
      : `לא נבחרה אף תמונה<div class="muted">גבוליות אינן מסומנות מראש — במכוון.</div>`;

    state.matches.forEach((m) => {
      const card = document.querySelector(`.card[data-id="${m.id}"]`);
      if (card) card.classList.toggle("selected", state.selected.has(m.id));
    });
  }

  function renderResults(data) {
    state.matches = data.matches;
    // P2-1 — certain is pre-selected, borderline never is.
    state.selected = new Set(
      data.matches.filter((m) => m.confidence === "certain").map((m) => m.id)
    );

    headerRowEl.innerHTML = "";
    const summary = document.createElement("span");
    summary.textContent = `${data.total} תוצאות · ${data.certain} ודאיות`;
    headerRowEl.appendChild(summary);

    if (data.total > 0) {
      const all = document.createElement("button");
      all.className = "link-button";
      all.textContent = "בחר הכל";
      all.addEventListener("click", () => {
        state.matches.forEach((m) => state.selected.add(m.id));
        document.querySelectorAll(".pick input").forEach((cb) => (cb.checked = true));
        renderSelection();
      });
      const none = document.createElement("button");
      none.className = "link-button";
      none.textContent = "נקה בחירה";
      none.addEventListener("click", () => {
        state.selected.clear();
        document.querySelectorAll(".pick input").forEach((cb) => (cb.checked = false));
        renderSelection();
      });
      headerRowEl.appendChild(all);
      headerRowEl.appendChild(none);
    }

    gridEl.innerHTML = "";
    if (data.total === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "אין תמונות שתואמות את החיפוש הזה. נסו להסיר פרדיקט או לנסח מחדש.";
      gridEl.appendChild(empty);
      actionBarEl.classList.remove("on");
      return;
    }

    data.matches.forEach((match) => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.id = match.id;

      const img = document.createElement("img");
      img.src = `/_ws/${match.thumb}`;
      img.alt = match.id;
      card.appendChild(img);

      const badge = document.createElement("span");
      badge.className = `badge ${match.confidence}`;
      badge.textContent = match.confidence === "certain" ? "ודאי" : "גבולי";
      card.appendChild(badge);

      const pick = document.createElement("label");
      pick.className = "pick";
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = state.selected.has(match.id);
      box.title = "סימון למחיקה";
      box.addEventListener("change", () => {
        if (box.checked) state.selected.add(match.id);
        else state.selected.delete(match.id);
        renderSelection();
      });
      pick.appendChild(box);
      card.appendChild(pick);

      const reason = document.createElement("div");
      reason.className = "reason";
      reason.textContent = match.reasons.map((r) => `${r.label} (${r.channel})`).join(", ");
      card.appendChild(reason);

      gridEl.appendChild(card);
    });

    renderSelection();
  }

  async function showGallery() {
    chipsEl.innerHTML = "";
    sourceNoteEl.textContent = "";
    state.predicates = [];
    state.lastExtractedQuery = null;
    state.matches = [];
    state.selected.clear();
    actionBarEl.classList.remove("on");

    const res = await fetch("/api/gallery");
    const data = await res.json();

    headerRowEl.textContent = `${data.total} תמונות בקטלוג`;
    gridEl.innerHTML = "";
    data.photos.forEach((photo) => {
      const card = document.createElement("div");
      card.className = "card";
      const img = document.createElement("img");
      img.src = `/_ws/${photo.thumb}`;
      img.alt = photo.id;
      card.appendChild(img);
      gridEl.appendChild(card);
    });
  }

  async function runQuery() {
    const query = queryInput.value.trim();
    if (!query) {
      runButton.disabled = true;
      try { await showGallery(); } finally { runButton.disabled = false; }
      return;
    }

    runButton.disabled = true;
    try {
      if (query !== state.lastExtractedQuery) {
        const { predicates, source } = await postJSON("/api/predicates", { query });
        state.predicates = predicates;
        state.lastExtractedQuery = query;
        renderChips();
        sourceNoteEl.textContent =
          source === "cache" ? "פרדיקטים ממטמון (ללא קריאת רשת)" :
          source === "api" ? "פרדיקטים חדשים מה-API" :
          "נפילה חזרה: פיצול מילולי (ה-API לא זמין)";
      }
      state.lastRunQuery = query;
      const results = await postJSON("/api/search", { predicates: state.predicates });
      renderResults(results);
    } catch (err) {
      headerRowEl.textContent = "";
      gridEl.innerHTML = "";
      actionBarEl.classList.remove("on");
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = `שגיאה: ${err.message}`;
      gridEl.appendChild(empty);
    } finally {
      runButton.disabled = false;
    }
  }

  // --- P2-3: copy to quarantine ------------------------------------------
  async function copyToQuarantine() {
    const ids = state.matches.filter((m) => state.selected.has(m.id)).map((m) => m.id);
    if (!ids.length) return;
    copyButton.disabled = true;
    try {
      await postJSON("/api/quarantine", { ids, query: state.lastRunQuery });
      await refreshQuarantine();
      bannerEl.scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (err) {
      alertSheet("ההעתקה נכשלה", err.message);
    } finally {
      copyButton.disabled = false;
    }
  }

  function closeSheet() { overlayEl.classList.remove("on"); }

  function alertSheet(title, text) {
    sheetEl.innerHTML = "";
    const h = document.createElement("h2");
    h.textContent = title;
    const p = document.createElement("p");
    p.textContent = text;
    const actions = document.createElement("div");
    actions.className = "actions";
    const close = document.createElement("button");
    close.id = "closeSheet";
    close.textContent = "סגירה";
    close.addEventListener("click", closeSheet);
    actions.appendChild(close);
    sheetEl.append(h, p, actions);
    overlayEl.classList.add("on");
  }

  // --- P2-7: the approval screen -----------------------------------------
  async function openApproval() {
    await refreshQuarantine();
    const q = state.quarantine;
    if (!q || q.awaiting === 0) {
      alertSheet("אין מה לאשר", "תיקיית ההסגר ריקה. הריצו שאילתה, סמנו תמונות והעתיקו אותן להסגר.");
      return;
    }

    sheetEl.innerHTML = "";
    const h = document.createElement("h2");
    h.textContent = "אישור מחיקה";
    const count = document.createElement("p");
    count.innerHTML = `<span class="count">${q.awaiting}</span> תמונות ימחקו.`;
    const where = document.createElement("p");
    where.textContent = "התמונות שיימחקו הן אלה שנמצאות כרגע בתיקיית ההסגר:";
    const path = document.createElement("div");
    path.className = "path";
    path.textContent = q.folder;

    const meaning = document.createElement("div");
    meaning.className = "note";
    meaning.innerHTML =
      "<strong>מה המחיקה עושה כאן:</strong> מקור התמונות הוא תיקייה מקומית במחשב הזה, " +
      "ולכן המחיקה מקומית בלבד — היא לא מתפשטת לשום מכשיר אחר ולא לענן. " +
      "אילו המקור היה תיקייה מסונכרנת, המחיקה הייתה מתפשטת לכל המכשירים — " +
      "וזו הסיבה שהמערכת מעתיקה ולעולם לא מעבירה.";

    const spared = document.createElement("p");
    spared.innerHTML =
      "כל תמונה שהוצאתם מתיקיית ההסגר לפני האישור <strong>לא תימחק</strong>. " +
      "אפשר לפתוח את התיקייה עכשיו ולהוציא ממנה מה שרוצים להשאיר.";

    const actions = document.createElement("div");
    actions.className = "actions";
    const confirm = document.createElement("button");
    confirm.id = "confirmDelete";
    confirm.textContent = `כן, מחקו ${q.awaiting} תמונות`;
    confirm.addEventListener("click", approveDeletion);
    const cancel = document.createElement("button");
    cancel.id = "cancelApprove";
    cancel.textContent = "ביטול";
    cancel.addEventListener("click", closeSheet);
    actions.append(confirm, cancel);

    sheetEl.append(h, count, where, path, meaning, spared, actions);
    overlayEl.classList.add("on");
  }

  async function approveDeletion() {
    const confirm = document.getElementById("confirmDelete");
    if (confirm) { confirm.disabled = true; confirm.textContent = "מוחק…"; }
    let result;
    try {
      result = await postJSON("/api/approve", {});
    } catch (err) {
      alertSheet("המחיקה נכשלה", err.message);
      return;
    }

    sheetEl.innerHTML = "";
    const h = document.createElement("h2");
    h.textContent = "בוצע";
    const p1 = document.createElement("p");
    p1.innerHTML = `<strong>${result.deleted}</strong> תמונות נמחקו מתיקיית התמונות.`;
    const p2 = document.createElement("p");
    p2.innerHTML = result.released
      ? `<strong>${result.released}</strong> תמונות הוצאו מההסגר לפני האישור — ` +
        `הן <strong>לא</strong> נמחקו והן עדיין בתיקיית התמונות.`
      : "לא הוצאה אף תמונה מההסגר לפני האישור.";
    const p3 = document.createElement("p");
    p3.className = "note";
    p3.textContent = `מדד שחרור לסבב הזה: ${Math.round(result.release_rate * 100)}% · ` +
      `כל מחיקה תועדה ב-demo/operation-log.json.`;

    const actions = document.createElement("div");
    actions.className = "actions";
    const close = document.createElement("button");
    close.id = "closeSheet";
    close.textContent = "סגירה";
    close.addEventListener("click", async () => {
      closeSheet();
      await refreshQuarantine();
      if (state.lastRunQuery) { queryInput.value = state.lastRunQuery; await runQuery(); }
      else await showGallery();
    });
    actions.appendChild(close);
    sheetEl.append(h, p1, p2, p3, actions);
  }

  runButton.addEventListener("click", runQuery);
  queryInput.addEventListener("keydown", (e) => { if (e.key === "Enter") runQuery(); });
  copyButton.addEventListener("click", copyToQuarantine);
  bannerEl.addEventListener("click", openApproval);
  bannerButton.addEventListener("click", (e) => { e.stopPropagation(); openApproval(); });
  overlayEl.addEventListener("click", (e) => { if (e.target === overlayEl) closeSheet(); });

  showGallery();
  refreshQuarantine();
</script>
